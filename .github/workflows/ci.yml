# Continuous integration: lint, formatting and the full test suite on every supported Python.
#
# Dependencies are installed from requirements-dev.txt, whose bounds let pip pick the newest
# release that supports each interpreter. They are therefore NOT identical across the matrix:
# numpy 2.5 needs Python 3.12+, so the 3.11 job resolves an older numpy. The "Show the resolved
# versions" step records what each job actually ran with. Ruff is held to one minor series in
# requirements-dev.txt because its formatter output changes between minor releases.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # a failure on one version should not hide the result on the others
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Show the resolved versions
        run: |
          python --version
          python -m pip list
          python -m pip check

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatting (ruff format --check)
        if: ${{ !cancelled() }}
        run: ruff format --check .

      - name: Tests (pytest)
        if: ${{ !cancelled() }}
        run: python -m pytest
